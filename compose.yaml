x-app-environment: &app-environment
  DATABASE_URL: "${DATABASE_URL_DOCKER:-postgresql+asyncpg://postgres:postgres@postgres:5432/miller_schackman}"
  DATABASE_MIGRATION_URL: "${DATABASE_MIGRATION_URL_DOCKER:-postgresql+psycopg://postgres:postgres@postgres:5432/miller_schackman}"
  RABBITMQ_URL: "amqp://guest:guest@rabbitmq:5672/"
  TEMPORAL_ADDRESS: "temporal:7233"
  REDIS_URL: "redis://redis:6379/0"
  METRICS_ENABLED: "true"

services:
  migrate:
    build: .
    command: ["uv", "run", "alembic", "upgrade", "head"]
    env_file:
      - path: .env
        required: false
    environment: *app-environment
    depends_on:
      postgres:
        condition: service_healthy

  api:
    build: .
    ports:
      - "8000:8000"
    env_file:
      - path: .env
        required: false
    environment: *app-environment
    restart: unless-stopped
    depends_on:
      migrate:
        condition: service_completed_successfully
      rabbitmq:
        condition: service_healthy
      redis:
        condition: service_healthy
      temporal:
        condition: service_started

  outbound-send-dispatcher:
    build: .
    command:
      ["uv", "run", "python", "-m", "app.interfaces.workers.outbound_send_dispatch_worker"]
    ports:
      - "9101:9101"
    env_file:
      - path: .env
        required: false
    environment:
      <<: *app-environment
      OUTBOUND_SEND_DISPATCH_METRICS_HOST: "0.0.0.0"
      OUTBOUND_SEND_DISPATCH_METRICS_PORT: "9101"
      SMS_PROVIDER: "sink"
      EMAIL_PROVIDER: "sink"
      FUB_API_KEY: "${FUB_API_KEY:-local-monitoring-placeholder}"
    restart: unless-stopped
    depends_on:
      migrate:
        condition: service_completed_successfully
      rabbitmq:
        condition: service_healthy
      redis:
        condition: service_healthy
      temporal:
        condition: service_started

  prometheus:
    image: prom/prometheus:v3.2.1
    command:
      - "--config.file=/etc/prometheus/prometheus.yml"
      - "--storage.tsdb.path=/prometheus"
    ports:
      - "9090:9090"
    volumes:
      - ./docker/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus_data:/prometheus
    restart: unless-stopped
    depends_on:
      - api
      - outbound-send-dispatcher

  grafana:
    image: grafana/grafana:11.5.2
    environment:
      GF_AUTH_ANONYMOUS_ENABLED: "true"
      GF_AUTH_ANONYMOUS_ORG_ROLE: "Viewer"
      GF_AUTH_DISABLE_LOGIN_FORM: "true"
      GF_DASHBOARDS_DEFAULT_HOME_DASHBOARD_PATH: "/var/lib/grafana/dashboards/outbound-send-dispatch.json"
    ports:
      - "3000:3000"
    volumes:
      - ./docker/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./docker/grafana/dashboards:/var/lib/grafana/dashboards:ro
      - grafana_data:/var/lib/grafana
    restart: unless-stopped
    depends_on:
      - prometheus

  postgres:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_DB: "${POSTGRES_DB:-miller_schackman}"
      POSTGRES_USER: "${POSTGRES_USER:-postgres}"
      POSTGRES_PASSWORD: "${POSTGRES_PASSWORD:-postgres}"
    ports:
      - "55432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "pg_isready -U ${POSTGRES_USER:-postgres} -d ${POSTGRES_DB:-miller_schackman}",
        ]
      interval: 5s
      timeout: 5s
      retries: 10

  cloudbeaver:
    image: dbeaver/cloudbeaver:latest
    depends_on:
      postgres:
        condition: service_healthy
    entrypoint: ["/bin/sh", "/opt/cloudbeaver/init/bootstrap.sh"]
    environment:
      CB_SERVER_NAME: "${CLOUDBEAVER_SERVER_NAME:-Miller Schackman DB Explorer}"
      CB_SERVER_URL: "${CLOUDBEAVER_SERVER_URL:-http://localhost:58978/}"
      CB_ADMIN_NAME: "${CLOUDBEAVER_ADMIN_NAME:-cbadmin}"
      CB_ADMIN_PASSWORD: "${CLOUDBEAVER_ADMIN_PASSWORD:-change-me-local-cloudbeaver-admin}"
      CLOUDBEAVER_APP_ANONYMOUS_ACCESS_ENABLED: "false"
      CLOUDBEAVER_SYSTEM_VARIABLES_RESOLVING_ENABLED: "true"
      CB_DB_CONNECTION_NAME: "${CLOUDBEAVER_DB_CONNECTION_NAME:-Miller Schackman Postgres}"
      CB_DB_HOST: "${CLOUDBEAVER_DB_HOST:-postgres}"
      CB_DB_PORT: "${CLOUDBEAVER_DB_PORT:-5432}"
      CB_DB_NAME: "${POSTGRES_DB:-miller_schackman}"
      CB_DB_USER: "${POSTGRES_USER:-postgres}"
      CB_DB_PASSWORD: "${POSTGRES_PASSWORD:-postgres}"
    ports:
      - "58978:8978"
    volumes:
      - cloudbeaver_workspace:/opt/cloudbeaver/workspace
      - ./docker/cloudbeaver/bootstrap.sh:/opt/cloudbeaver/init/bootstrap.sh:ro
      - ./docker/cloudbeaver/data-sources.template.json:/opt/cloudbeaver/init/data-sources.template.json:ro

  rabbitmq:
    image: rabbitmq:3-management-alpine
    ports:
      - "55672:5672"
      - "15673:15672"
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    ports:
      - "56379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10

  mailpit:
    image: axllent/mailpit:v1.27.8
    ports:
      - "51025:1025"
      - "58025:8025"

  temporal-postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: temporal
      POSTGRES_USER: temporal
      POSTGRES_PASSWORD: temporal
    volumes:
      - temporal_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U temporal -d temporal"]
      interval: 5s
      timeout: 5s
      retries: 20

  temporal:
    image: temporalio/auto-setup:1.27.2
    depends_on:
      temporal-postgres:
        condition: service_healthy
    environment:
      DB: postgres12
      DB_PORT: 5432
      POSTGRES_USER: temporal
      POSTGRES_PWD: temporal
      POSTGRES_SEEDS: temporal-postgres
    ports:
      - "57233:7233"

  temporal-ui:
    image: temporalio/ui:2.34.0
    depends_on:
      - temporal
    environment:
      TEMPORAL_ADDRESS: temporal:7233
      TEMPORAL_CORS_ORIGINS: http://localhost:3000
    ports:
      - "58080:8080"

volumes:
  cloudbeaver_workspace:
  grafana_data:
  postgres_data:
  prometheus_data:
  redis_data:
  temporal_postgres_data:
