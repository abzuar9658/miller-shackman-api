[project]
name = "miller-schackman-api"
version = "0.1.0"
description = "FastAPI backend for Miller Schackman AI lead nurturing platform"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "aio-pika>=9.6.2",
    "alembic>=1.18.5",
    "asyncpg>=0.31.0",
    "boto3>=1.43.40",
    "email-validator>=2.3.0",
    "fastapi>=0.139.0",
    "gunicorn>=26.0.0",
    "httpx>=0.28.1",
    "openai>=2.44.0",
    "passlib[bcrypt]>=1.7.4",
    "phonenumbers>=9.0.34",
    "prometheus-client>=0.25.0",
    "psycopg[binary]>=3.3.4",
    "pydantic-settings>=2.14.2",
    "python-jose[cryptography]>=3.5.0",
    "python-multipart>=0.0.32",
    "redis>=8.0.1",
    "sendgrid>=6.12.5",
    "sentry-sdk>=2.64.0",
    "sqlalchemy[asyncio]>=2.0.51",
    "structlog>=26.1.0",
    "temporalio>=1.30.0",
    "tenacity>=9.1.4",
    "twilio>=9.10.9",
    "uvicorn[standard]>=0.50.1",
]

[dependency-groups]
dev = [
    "faker>=40.28.1",
    "mypy>=2.1.0",
    "pytest>=9.1.1",
    "pytest-asyncio>=1.4.0",
    "pytest-cov>=7.1.0",
    "respx>=0.23.1",
    "ruff>=0.15.20",
    "time-machine>=3.2.0",
]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "ASYNC"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"

[tool.mypy]
python_version = "3.12"
strict = true
warn_unused_configs = true
plugins = ["pydantic.mypy"]

[[tool.mypy.overrides]]
module = ["boto3", "twilio.*", "sendgrid", "sendgrid.helpers.*"]
ignore_missing_imports = true

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
addopts = "-q"
markers = [
    "live_llm: calls the configured external LLM provider when explicitly enabled",
]
